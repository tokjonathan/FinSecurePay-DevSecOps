spring.application.name=finsecure-validator
server.port=8080

# Shown by GET /health. Uses the APP_VERSION env var if set (Jenkins/K8s),
# otherwise the version in pom.xml, filled in at build time.
app.version=${APP_VERSION:@project.version@}

# ---- Business rules ----
# ${ENV_VAR:default} = use the environment variable if set, else the default.
# In Kubernetes the ConfigMap sets MAX_AMOUNT and ALLOWED_CURRENCIES (Task 3).
validation.max-amount=${MAX_AMOUNT:10000}
validation.allowed-currencies=${ALLOWED_CURRENCIES:SGD,USD,EUR,MYR}

# ---- Actuator: Kubernetes probes + Prometheus metrics ----
management.endpoints.web.exposure.include=health,info,prometheus
# Enables /actuator/health/liveness and /actuator/health/readiness for K8s probes
management.endpoint.health.probes.enabled=true
# Tags every metric with the app name so Grafana can filter by it
management.metrics.tags.application=${spring.application.name}
# Records latency histograms so Grafana can show p95/p99 response times
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Finish in-flight requests before shutting down (smooth K8s rollouts)
server.shutdown=graceful
